<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>add post</title>
</head>
<body>

    <form action="{% url 'blog:addpost' %}" method="post">
        {% csrf_token %}
        <input type="text" name="title" placeholder="title"><br>
        <input type="text" name="content" placeholder="content"><br>
        <button type="submit">submit</button>
    </form>


    {% for post in posts %}
         <h3>عنوان</h3><p>{{post.title}}</p>
         <h3>متن</h3><p>{{post.content}}</p>
         <h3>تاریخ</h3><p>{{post.date}}</p>
         <h3>نویسنده</h3><p>{{post.author}}</p>
    {% endfor %}


</body>
</html>
